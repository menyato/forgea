packages:
  - api
  - web
  - packages/*

# Dependency install scripts are blocked unless reviewed and listed here.
allowBuilds:
  prisma@7.10.1: true
  '@prisma/engines@7.10.1': true
  # Reviewed, not needed: its postinstall only verifies the binary that @esbuild/<platform> ships.
  esbuild@0.28.2: false

# Security fixes for transitive dependencies, until upstream releases include them.
overrides:
  # GHSA-q7qp-rjg7-q26m (high, DoS). @nestjs/platform-express 12 still pins 2.4.0.
  multer: ^2.5.0
  # GHSA-7589-6fvf-x4pw (high, ReDoS). Prisma 7.10.1's config loader (pinned) locks 3.20.0.
  effect: ^3.22.1

# One version of each shared tool across the monorepo; packages reference these as "catalog:".
catalog:
  typescript: 6.0.3
  '@types/node': ^24.0.0
  vitest: ^4.1.2
  '@vitest/coverage-v8': ^4.1.2
  class-validator: ^0.14.2
  class-transformer: ^0.5.1
  # Phone numbers: the rules of every country (Google's libphonenumber data).
  libphonenumber-js: 1.13.15
  reflect-metadata: ^0.2.2
  dotenv: ^18.0.9
  # 3D: the shop's viewer and the text studio's shapes (web and @forgea/text3d) use one version.
  three: 0.186.1
  '@types/three': 0.186.0
  harfbuzzjs: 1.6.3
  clipper2-ts: 2.0.1-18
