# One environment of the shop (production or staging). The server runs this twice, from
# /srv/forgea/production and /srv/forgea/staging, each with its own .env, database, files and
# passwords; the shared front door is deploy/edge. Deployed by forgea-deploy (deploy/server).
#
# Who can reach what:
#   Caddy → <env>-web, and → <env>-api for the two Google sign-in paths, over "edge"
#     (forgea-edge-<env>: Caddy and this environment only — never the other environment)
#   web → api over this environment's own "app" network
#   api, migrate → postgres over "db" (internal: no internet in or out)
name: forgea-${ENV_NAME:?set ENV_NAME in .env}

# The apps' containers: no new privileges, no Linux capabilities, a read-only filesystem
# except their volumes and /tmp.
x-app: &app
  restart: unless-stopped
  init: true
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  logging:
    driver: local
    options: { max-size: 10m, max-file: '5' }

services:
  # Memory caps (set per environment in .env; staging lower): a heavy 3D upload on staging
  # can't take the memory production's database needs.
  web:
    <<: *app
    image: ${IMAGE_PREFIX:?}-web:${TAG:?}
    mem_limit: ${WEB_MEMORY:-512m}
    env_file: web.env
    networks:
      app: {}
      edge: { aliases: ['${ENV_NAME}-web'] }
    depends_on:
      api: { condition: service_healthy }

  api:
    <<: *app
    image: ${IMAGE_PREFIX}-api:${TAG}
    # Its 3D-model worker alone may use 1 GB.
    mem_limit: ${API_MEMORY:-2g}
    env_file: api.env
    environment:
      BACKUP_DIR: /backups
      BACKUP_REQUEST_DIR: /backup-requests
    volumes:
      - uploads:/data/uploads
      - outbox:/data/outbox
      # WhatsApp messages that couldn't be sent (no token yet), like unsent emails.
      - outbox-whatsapp:/data/outbox-whatsapp
      # The Backups page: it lists and downloads backups but can't change them (read-only);
      # it asks for a backup, restore or delete with a request backup.sh checks and runs.
      - ./backups:/backups:ro
      - ./backup-requests:/backup-requests
    networks:
      # "app" also reaches the internet (Google sign-in, Gmail, Calendar).
      app: { aliases: ['${ENV_NAME}-api'] }
      edge: { aliases: ['${ENV_NAME}-api'] }
      db: {}
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    mem_limit: ${DB_MEMORY:-1g}
    # The last thing the kernel kills when memory runs out (production: -500; staging: 0).
    oom_score_adj: ${DB_OOM_SCORE_ADJ:--500}
    env_file: db.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the app's own least-privilege role on first start (never the superuser).
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [db]
    shm_size: 256m
    healthcheck:
      # Over TCP: the temporary server of the first start listens on the socket only.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres']
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: local
      options: { max-size: 10m, max-file: '5' }

  # Applies pending migrations, then exits (forgea-deploy runs it). It gets only the database
  # address, none of the app's other secrets.
  migrate:
    image: ${IMAGE_PREFIX}-migrate:${TAG}
    env_file: migrate.env
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    networks: [db]
    depends_on:
      postgres: { condition: service_healthy }
    profiles: [tools]

volumes:
  pgdata:
  uploads:
  outbox:
  outbox-whatsapp:

networks:
  app:
  db:
    internal: true
  # Created by deploy/edge: Caddy and this environment only.
  edge:
    name: forgea-edge-${ENV_NAME}
    external: true
