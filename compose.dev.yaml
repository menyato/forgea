# Local development only: PostgreSQL in Docker, for a machine without one installed.
#   docker compose -f compose.dev.yaml up -d
# Then in api/.env (the password is for this local container only):
#   DATABASE_URL="postgresql://forgea_app:forgea-dev@localhost:5432/forgea?schema=public"
#   TEST_DATABASE_URL="postgresql://forgea_app:forgea-dev@localhost:5432/forgea_test?schema=public"
# The apps themselves run with pnpm (docs/LOCAL_SETUP.md), for instant reloads.
name: forgea-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forgea_app
      POSTGRES_PASSWORD: forgea-dev
      POSTGRES_DB: forgea
    # Only this computer can connect.
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >-
      sh -c "echo 'CREATE DATABASE forgea_test OWNER forgea_app;' >
      /docker-entrypoint-initdb.d/test-db.sql && exec docker-entrypoint.sh postgres"

volumes:
  pgdata:
