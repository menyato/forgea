name: Deploy

# Push to `staging` → staging.forgea-lab.com; push to `production` → forgea-lab.com.
# (`development` is for daily work: CI only.)
# Every deploy first runs the full CI. Roll back: Actions → Deploy → "Run workflow" with an
# earlier image tag (sha-<first 7 characters of the commit>).
on:
  push:
    branches: [staging, production]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
      tag:
        description: Image tag to deploy again, e.g. sha-1a2b3c4
        required: true

permissions:
  contents: read

# One deploy per environment at a time; a newer push waits rather than cancelling a deploy.
concurrency:
  group: deploy-${{ github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/forgea

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  images:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Three images from one Dockerfile; the shared build stage is cached between them. A tag
      # already pushed (production after staging, same commit) is used as it is: production
      # runs the very images staging was checked with, and a tag never changes its contents.
      - name: Build and push api, web and migrate
        run: |
          for target in api web migrate; do
            image="$IMAGE_PREFIX-$target:${{ steps.tag.outputs.tag }}"
            if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "$image exists: reused"
              continue
            fi
            docker buildx build . --target "$target" --push \
              --tag "$IMAGE_PREFIX-$target:${{ steps.tag.outputs.tag }}" \
              --cache-from type=gha,scope=forgea \
              --cache-to type=gha,scope=forgea,mode=max
          done

  deploy:
    if: always() && (needs.images.result == 'success' || github.event_name == 'workflow_dispatch')
    needs: images
    runs-on: ubuntu-latest
    # Production backs up before migrating: a few minutes more.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      # Each branch deploys to the environment of the same name; a manual run names its target.
      TARGET: ${{ github.event.inputs.environment || github.ref_name }}
      TAG: ${{ github.event.inputs.tag || needs.images.outputs.tag }}
    # No checkout: the server already has its stack definitions (deploy/sync-config.sh) and
    # only ever receives an image tag from here.
    steps:
      - name: Deploy ${{ env.TAG }} to ${{ env.TARGET }}
        env:
          HOST: ${{ secrets.SSH_HOST }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          # One key per environment; on the server each can only deploy its own environment.
          PRODUCTION_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
          STAGING_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          # The job's own token, valid only while it runs, lets the server pull the private images.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$TAG" in
            sha-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "Not an image tag: $TAG"; exit 1 ;;
          esac
          case "$TARGET" in
            production) key=$PRODUCTION_KEY ;;
            staging) key=$STAGING_KEY ;;
            *) echo "Unknown environment $TARGET"; exit 1 ;;
          esac
          [ -n "$HOST" ] && [ -n "$key" ] || { echo 'The deploy secrets are missing (deploy/README.md, step 7)'; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          # The server's own fingerprint, saved when it was created: no trust on first use.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server runs only forgea-deploy-gate for this key: the "command" is just the tag.
          printf '%s' "$GHCR_TOKEN" | ssh "ci@$HOST" "$TAG"
