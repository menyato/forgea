name: CI

# Every push to development, every pull request, and as the first step of every deploy
# (deploy.yml calls it).
on:
  push:
    branches: [development]
  pull_request:
  workflow_call:

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Throwaway database for the e2e suite; same major version as local development.
    services:
      postgres:
        image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
        env:
          POSTGRES_USER: forgea_app
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: forgea_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forgea_app"
          --health-interval 5s --health-timeout 5s --health-retries 10

    # CI-only values. Nothing here is a production secret.
    env:
      DATABASE_URL: postgresql://forgea_app:ci-only-password@localhost:5432/forgea_test?schema=public
      TEST_DATABASE_URL: postgresql://forgea_app:ci-only-password@localhost:5432/forgea_test?schema=public
      JWT_ACCESS_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0001
      COOKIE_SECRET: ci-only-cookie-secret-not-used-anywhere-else-01
      # The e2e journeys call the API as the storefront does, forwarding the shopper's IP with it.
      INTERNAL_PROXY_SECRET: ci-only-proxy-secret-not-used-anywhere-else-0001
      # The browser tests sign in as this local admin (api/scripts/dev-admin-session.ts).
      BOOTSTRAP_ADMIN_EMAIL: owner@forgea-lab.test

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Reads the exact version from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install (lockfile must be up to date)
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (fails on high or critical)
        run: pnpm audit --audit-level high

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unused files, exports and dependencies
        run: pnpm knip

      - name: Unit tests
        run: pnpm test

      - name: End-to-end tests (real Postgres)
        run: pnpm --filter @forgea/api test:e2e

      # Real Chrome (preinstalled on GitHub's Ubuntu runners), desktop and phone sizes.
      - name: Browser tests (storefront journeys)
        # Its own limit, so a stuck run still leaves time to keep the traces below.
        timeout-minutes: 12
        run: pnpm --filter @forgea/web test:browser

      # Playwright's trace of each failed test (network, console, screenshots): download it from
      # the run's page and open it with `pnpm --filter @forgea/web exec playwright show-trace`.
      - name: Keep the traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-traces
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore
