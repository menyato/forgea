name: CI

# Every push to development, every pull request, and as the first step of every deploy
# (deploy.yml calls it).
on:
  push:
    branches: [development]
  pull_request:
  workflow_call:

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Throwaway database for the e2e suite; same major version as local development.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forgea_app
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: forgea_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forgea_app"
          --health-interval 5s --health-timeout 5s --health-retries 10

    # CI-only values. Nothing here is a production secret.
    env:
      DATABASE_URL: postgresql://forgea_app:ci-only-password@localhost:5432/forgea_test?schema=public
      TEST_DATABASE_URL: postgresql://forgea_app:ci-only-password@localhost:5432/forgea_test?schema=public
      JWT_ACCESS_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0001
      COOKIE_SECRET: ci-only-cookie-secret-not-used-anywhere-else-01
      # The browser tests sign in as this local admin (api/scripts/dev-admin-session.ts).
      BOOTSTRAP_ADMIN_EMAIL: owner@forgea-lab.test

    steps:
      - uses: actions/checkout@v5

      # Reads the exact version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install (lockfile must be up to date)
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (fails on high or critical)
        run: pnpm audit --audit-level high

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unused files, exports and dependencies
        run: pnpm knip

      - name: Unit tests
        run: pnpm test

      - name: End-to-end tests (real Postgres)
        run: pnpm --filter @forgea/api test:e2e

      # Real Chrome (preinstalled on GitHub's Ubuntu runners), desktop and phone sizes.
      - name: Browser tests (storefront journeys)
        run: pnpm --filter @forgea/web test:browser
